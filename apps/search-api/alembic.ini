# Alembic 配置（服务自管迁移）：script_location 用 %(here)s 定位到本服务的 migrations/
# 运行入口统一从仓库根（Makefile 封装）：
#   uv run --package search-api alembic -c apps/search-api/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# 连接串不落盘：migrations/env.py 从 app.core.config 的 db_settings 组装（密钥只进 .env）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
