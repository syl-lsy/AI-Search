[project]
name = "search-api"
version = "0.1.0"
description = "ai-search 后端服务（类 Perplexity AI 搜索引擎；导入包名 app）"
requires-python = ">=3.12"
dependencies = [
    # ── Web/数据运行栈：核心依赖 == 锁定，沿用 python-backend-base 基座锁定值
    #    （ARCH v1.21 §2 依赖策略：FastAPI==0.136.3、SQLAlchemy==2.0.50、asyncpg==0.31.0、loguru==0.7.3 等）；
    #    uvicorn/alembic 为基座模板未直接声明的项，取 2026-11-04 PyPI 当日稳定版锁定
    "fastapi[standard]==0.136.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.20.1",
    "pydantic",                # 版本随 fastapi[standard]/pydantic-settings 由解析器约束，uv.lock 快照定版
    "pydantic-settings==2.16.0",
    "loguru==0.7.3",
    # B1 双健康探针出站探活（MinIO /minio/health/live + LiteLLM 轻量探活，api.md §1.2）：
    # httpx 升为运行依赖（== 锁定，与 dev 组同版）——原「骨架期 app 代码不引用」口径随探针落地解除
    "httpx==0.28.1",
    # M2 批次 2 修复轮：save_snapshot 快照链默认路径运行依赖（object_cleanup 同款 SDK）——
    # live 验证发现 B②：SDK 不在依赖时 importlib ModuleNotFoundError，首轮真读即断快照链
    # （原「批次 1 交付说明『生产接线前须补运行依赖』预警」于本批兑现）。== 锁定
    # （2026-11-19 PyPI 当日稳定版）；升级随 minio-py 上游演进并重跑活体实测护栏
    "minio==7.2.20",
    # ── AI 栈：== 锁定（ARCH v1.21 依赖策略「AI 依赖取当日稳定版锁定」；锁定值 = 2026-11-04 uv.lock 定版快照）
    "langgraph==1.2.19",       # M2 批次 0 == 锁定（=uv.lock 现解析值；原 ARCH「>=1.1 下限例外」收口，deep 流式 subgraphs=True + StreamPart v2 语义不变，§6.1）
    "langchain==1.4.9",        # 2026-11-04 当日稳定版锁定
    "langchain-openai==1.7.4", # R8：ReasoningChatModel 覆写私有 API——锁版本 + 单测护栏（护栏单测 B1 落，ARCH §6.7）
    "langchain-mcp-adapters==0.3.2",
    # B3 第 0 步：searxng 薄 stdio MCP wrapper（app/agent/tools/searxng_mcp.py）直接依赖——
    # mcp SDK（FastMCP server 侧）。版本随 uv.lock 既有解析（langchain-mcp-adapters 传递
    # 依赖已解析 1.30.0），显式声明为运行依赖并 == 锁定；升级须随 langchain-mcp-adapters 联动
    "mcp==1.30.0",
    "deepagents==0.7.32",      # M2 批次 0 == 锁定（=uv.lock 现解析值；原 ARCH「>=0.5.3 下限例外」收口，子代理 response_format=SummarySchema 语义不变，ARCH S15）
    # R15：nacos-sdk-python 3.2.0 × Nacos server v3.2.4 三链路已验证（s0-batch1-handoff.md 续 10）。
    # 锁版本 + 单测护栏（登录硬编码 v1 兼容端点 /nacos/v1/auth/users/login——上游收掉 v1 auth 即断，
    # R8 同口径）；导入名 v2.nacos、方法全 asyncio 协程
    "nacos-sdk-python==3.2.0",
    # Langfuse 节点级 span（trace root=轮、session=thread_id，ARCH §6.6）：B3 落 3.15.0，
    # 2026-11-13 升 4.18.0——v5 首选路径被服务端版本卡死（Langfuse server 4.56.0 < SDK 5.x
    # 硬要求 4.59.0，:4 大版本锁 pull 未滚动），按用户阶梯裁决回退 4.x 线最新的 4.18.0；
    # 服务端升到 ≥4.59 后可重探 v5（v5.2.0 主包 requires_dist 实测无 langchain-core 项）。
    # CallbackHandler 接入面不变：trace_id=turn_id（32-hex）经 trace_context；session/user/
    # tags 经 config metadata 契约键 langfuse_session_id/langfuse_user_id/langfuse_tags
    # （官方文档保留）；metadata 收紧 dict[str,str] 且值≤200 字符。== 锁定（R8 同口径：
    # 与 langchain-openai 私有面联动升级前先跑观测护栏，断言见 test_observability.py）
    "langfuse==4.18.0",
    # M3 批次 1（B16）：kb_chunks.embedding vector(1024) 列类型（pgvector.sqlalchemy
    # Vector，迁移 0013_m3_kb 与 ORM 两侧同型——alembic check 零漂移依赖同型）。
    # == 锁定（2026-11-23 PyPI 当日稳定版 0.5.1；0.2.4+ 起支持 vector 类型反射——
    # alembic check 的 db 反射面所需）。
    "pgvector==0.5.1",
    # ── M3 批次 2（B17）归一化组件：== 锁定（版本 = docs/research/
    # m3-probe-normalization-20261122.md §1 探针实证记录；OCR 引擎钉 PaddleOCR =
    # PRD v1.34 用户裁决 OQ-25——RapidOCR 留 M3+ 重场景复核线，docling 依赖树原生带
    # rapidocr 3.10.0 作对照线）。首跑模型下载属部署动作非运行时：Docling/Paddle 模型
    # 目录预置 + HF_HUB_OFFLINE=1（探针已验证离线复跑可用，.env.example 同批注）。
    "markitdown[docx,html]==0.1.9",  # Office/HTML/飞书导出 docx 主线转换（docx 代码块缺口由 Docling docx 对照线兜——探针 §2.1）
    "docling==2.151.1",              # pdf 主线（版面/表格/页码级溯源 loc.page；探针 §2.2——core 2.108.0 / ibm-models 4.0.4 随装）
    "paddleocr==3.7.0",              # OCR 通道（paddlex 3.7.2 随装；init 首跑下载 PP-OCRv6 medium 检测+识别模型——探针 §2.3）
    "paddlepaddle==3.3.1",           # PaddleOCR 推理后端（CPU；OQ-32 本地 CPU 进程内）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 把 app/ 打包进服务，使 `uv run --package search-api python -c "import app.xxx"` 与跨服务 import 可用
[tool.hatch.build.targets.wheel]
packages = ["app/"]

# 开发/测试依赖（不随生产安装）：三层测试（unit/integration/e2e）与调试
# httpx = integration ASGITransport / e2e 轮询（ARCH dev 组锚点项；运行依赖侧已按
#   B1 探针出站需要显式声明，两侧同版本 ==0.28.1）
# debugpy = 断点调试器（ARCH dev 组锚点项；派单口径写作 "debuggy"，实为基座模板的 debugpy——
#   PyPI "debuggy" 是无关的 StackOverflow 检索工具，非调试器）
# conftest 的 load_dotenv 所需 python-dotenv：B1 工具链钉版起显式声明（== 锁定；
# 与 pydantic-settings 传递引入版本一致），不再依赖传递依赖的隐式可用性
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "debugpy==1.8.22",
    "psycopg2-binary==2.9.13",
    # B1 工具链钉版（2026-11-07 PyPI 当日稳定版）：pyright（basic 类型检查）+
    # ruff（lint），范围与配置见仓库根 pyproject [tool.pyright]/[tool.ruff]，
    # 命令入口 make typecheck-backend（替换骨架期 compileall 段）
    "pyright==1.1.414",
    "ruff==0.17.4",
    "python-dotenv==1.2.4",
    # M3 飞书接入（ARCH B20 行既有钉定）：探查工具面首次落地——notebooks/
    #   feishu_kb_tree_probe.ipynb 的 wiki/docx/drive 通道走官方 lark-oapi SDK。
    #   仅 dev 组（notebook 开发辅助面）；生产面随 B20 实施再进 [project]，
    #   届时沿用同一 == 锁定版本。
    "lark-oapi==1.8.0",
    # notebook 交付物的执行验证最小面（nbformat 结构校验 + nbclient 真执行）：
    #   开发辅助，不进生产。与同组其余项一致用 == 精确锁（值 = 2026-11-24 uv.lock 定版）
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.4.0",
    # R4 依赖 CVE 清零（2026-11-15 专项，原「互锁接受」解除）：langgraph-cli 的 inmem
    #   extra 此前钉 langgraph-api<0.6.0，而 0.5.x 全档反钉 cryptography<45.0，使两条
    #   修复线（langgraph-api ≥0.15.0 / cryptography ≥50.0.0）互锁不可达。0.4.43 起该
    #   上界放宽为 langgraph-api<1.0.0，故三包可同批过线。版本三元组（2026-11-15）：
    #   ① langgraph-cli 0.4.43、cryptography 50.0.2 = 当日 PyPI 最高稳定版；
    #   ② langgraph-api 0.17.2 = mcp==1.30.0 兼容线内最高稳定版（全库最高稳定 0.18.0
    #      因 mcp<3,>=2.3.0 与运行依赖 mcp==1.30.0／langchain-mcp-adapters 0.3.2 的
    #      mcp<2.0.0 硬冲突而排除，升级路径挂 M2+）。
    #   附带上限效应：langgraph-api 0.17.2 要求 grpcio>=1.81.0,<1.82.0，运行依赖
    #   nacos-sdk-python 共用的 grpcio 随之降至 1.81.2。
    #   附：0.17.2 强制引入 opentelemetry-exporter-prometheus 0.66b2（pre-release，区间
    #   <0.67,>=0.63b1 内无稳定版可选，dev-only 不进运行闭包；用户已批 pre-release 进
    #   dev 组 2026-11-15）。
    #   证据与处置见 docs/security-audit-m1-batch8.md §五.4。
    "langgraph-cli[inmem]==0.4.43",
    # 显式钉版（dev 工具链传递）：studio inmem server 版本不再被动漂移
    "langgraph-api==0.17.2",
    # 显式钉版：cryptography 同时是运行时传递依赖（alibabacloud-* / google-auth / pyjwt
    #   链路），钉在修复线最高稳定版；uv.lock 单版本解析使运行侧同样拿 50.0.2
    "cryptography==50.0.2",
    # R4 依赖 CVE 机扫通道（security-audit-m1-batch8.md）：pip-audit 环境审计模式
    # （枚举本 venv 已装发行版比对 PyPI Advisory DB），命令入口 make audit。
    # == 钉版（2026-11-13 PyPI 当日稳定版 2.10.1）；其传递依赖自带 pip（uv venv 默认无 pip，
    #    环境枚举所需随装即用）
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_db: 需要真实 PostgreSQL（读仓库根 .env.test 的 DB_ 组；缺凭证/库不可达时 skip）",
    "requires_nacos: 需要 Nacos 运行（读 .env.test NACOS_ 组；缺凭证时 skip）",
    "requires_langfuse: 需要 Langfuse 运行（读 .env.test LANGFUSE_ 组；缺凭证时 skip）",
    "requires_llm: 需要 LiteLLM 网关与本地 light 模型（读 .env LITELLM_ 组；网关/别名不可达时 skip）",
    "requires_search: 需要搜索源凭证（读 .env MCP 凭证组；缺凭证逐源 skip）",
]
